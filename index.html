<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>愿你的一天</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
      background: #2b2b2b;
      touch-action: manipulation;
    }
    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(145deg, #1e1e2e 0%, #2d2d44 50%, #252535 100%);
    }
    .mini-win {
      position: absolute;
      width: 148px;
      max-width: 42vw;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.18);
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.85);
      animation: winIn 0.22s ease forwards;
    }
    @keyframes winIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .mini-win-title {
      height: 26px;
      background: linear-gradient(180deg, #f5f5f5 0%, #e8e8e8 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 8px;
      font-size: 10px;
      color: #666;
      border-bottom: 1px solid #ccc;
      cursor: default;
      user-select: none;
    }
    .mini-win-title span.title-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: #444;
    }
    .mini-win-btns {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }
    .mini-win-btns i {
      font-style: normal;
      width: 12px;
      height: 12px;
      line-height: 12px;
      text-align: center;
      font-size: 9px;
      color: #555;
      border-radius: 2px;
    }
    .mini-win-btns i:hover { background: rgba(0, 0, 0, 0.08); }
    .mini-win-btns i.close:hover {
      background: #e81123;
      color: #fff;
    }
    .mini-win-body {
      padding: 10px 8px 12px;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
      min-height: 56px;
      max-height: 92px;
      overflow-y: auto;
      word-break: break-word;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #222;
      text-shadow: 0 0 1px rgba(255, 255, 255, 0.4);
      -webkit-overflow-scrolling: touch;
    }
    .toolbar {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      gap: 8px;
    }
    .toolbar button {
      font-size: 13px;
      padding: 8px 16px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #333;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .toolbar button:active { opacity: 0.88; }
  </style>
</head>
<body>
  <div id="stage" aria-label="祝福小窗"></div>
  <div class="toolbar">
    <button type="button" id="btnClear">一键收走全部</button>
  </div>

  <script>
    (function () {
      var lines = [
        { text: "天天开心，事事顺心！", emoji: "🌸" },
        { text: "今天也要对自己温柔一点～", emoji: "💛" },
        { text: "你超棒的，继续加油！", emoji: "⭐" },
        { text: "愿你所遇皆温暖，所行皆坦途。", emoji: "🌈" },
        { text: "记得喝水、早点休息呀。", emoji: "🍵" },
        { text: "平安喜乐，万事胜意。", emoji: "✨" },
        { text: "心若向阳，无惧悲伤。", emoji: "☀️" },
        { text: "慢慢来，你一直在进步。", emoji: "🌿" },
        { text: "今天的小目标：开心就好。", emoji: "🎈" },
        { text: "愿有人懂你沉默，也有人陪你热闹。", emoji: "🫶" },
        { text: "累的时候就歇一歇，不丢人。", emoji: "☕" },
        { text: "你值得被好好对待，尤其是被自己。", emoji: "💖" },
        { text: "好运正在路上，请保持微笑。", emoji: "🍀" },
        { text: "平凡的日子里也有小确幸。", emoji: "🌻" },
        { text: "别急，花会开，你也会越来越好。", emoji: "🌺" },
        { text: "愿你三餐温暖，四季安然。", emoji: "🍊" },
        { text: "做自己喜欢的事，慢一点也没关系。", emoji: "🎵" },
        { text: "明天的你会感谢今天努力的自己。", emoji: "💪" },
        { text: "世界很大，此刻的不快只是很小的一部分。", emoji: "🌙" },
        { text: "给自己一个拥抱，你真的已经很好了。", emoji: "🤗" },
        { text: "愿心事有处说，愿疲惫有处歇。", emoji: "🕊️" },
        { text: "阳光会穿过云层照到你身上。", emoji: "☀️" },
        { text: "把烦恼留给昨天，把希望留给今天。", emoji: "🌈" },
        { text: "你是独一无二的存在，自带光芒。", emoji: "💫" },
        { text: "愿所有等待，都有最好的回应。", emoji: "🎀" },
        { text: "今天也要元气满满呀！", emoji: "⭐" },
        { text: "温柔待世，也别忘了温柔待己。", emoji: "🌸" },
        { text: "每一步都算数，你并没有白费力气。", emoji: "🔮" },
        { text: "愿生活明朗，万物可爱。", emoji: "🦋" },
        { text: "与其内耗，不如好好睡一觉。", emoji: "🌙" },
        { text: "你的坚强，会有人看得见。", emoji: "💜" },
        { text: "小步向前，也是在靠近梦想。", emoji: "🎈" },
        { text: "愿你有诗有酒，也有远方可奔赴。", emoji: "🌈" },
        { text: "不完美也没关系，真实最动人。", emoji: "💛" },
        { text: "今天气象台：局部开心，全域祝福。", emoji: "☀️" },
        { text: "累了就抬头看看天空，它包容一切。", emoji: "🌿" },
        { text: "愿有人与你立黄昏，有人问你粥可温。", emoji: "🍵" },
        { text: "你笑起来的样子，真的很好看。", emoji: "🥰" },
        { text: "别否定自己，你超级重要。", emoji: "💖" },
        { text: "今日宜：开心、放松、善待自己。", emoji: "✨" },
        { text: "把期待降低，把把握当下放大。", emoji: "🌻" },
        { text: "愿你夜里有灯，梦里有人爱。", emoji: "🌙" },
        { text: "每一次尝试，都值得掌声。", emoji: "👏" },
        { text: "心情不好时，允许自己短暂断电。", emoji: "🔋" },
        { text: "你所担心的事，大多都不会发生。", emoji: "🍀" },
        { text: "愿你有底气说“不”，有勇气说“要”。", emoji: "💪" },
        { text: "辛苦啦，今天也安全通关了。", emoji: "🎮" },
        { text: "日子长长，总会遇到刚刚好的人和事。", emoji: "🌸" },
        { text: "愿你被岁月温柔以待。", emoji: "💐" },
        { text: "做一个内心有光的人，不急不躁。", emoji: "🕯️" },
        { text: "坏消息会过去，好消息在路上。", emoji: "📮" },
        { text: "你不需要完美，才值得被爱。", emoji: "💝" },
        { text: "愿你的付出，终有温柔的回报。", emoji: "🌺" },
        { text: "今天给自己一个小奖励吧～", emoji: "🎁" },
        { text: "路虽远行则可至，事虽难做则可成。", emoji: "🛤️" },
        { text: "别比较，每个人都有自己的花期。", emoji: "🌼" },
        { text: "愿你在人群里不迷失，独处时不孤单。", emoji: "🫶" },
        { text: "放松肩膀，深呼吸，一切都会好起来。", emoji: "🧘" },
        { text: "你是生活的主角，不是配角。", emoji: "🎬" },
        { text: "愿你所爱皆所得，所失亦无憾。", emoji: "💫" },
        { text: "再坚持一下，天就快亮了。", emoji: "🌅" },
        { text: "小小进步也值得大声夸奖自己。", emoji: "📣" },
        { text: "愿你有钱有闲有情有趣。", emoji: "💰" },
        { text: "把“我不行”换成“我试试”。", emoji: "✨" },
        { text: "世界喜欢勇敢的人，而你很勇敢。", emoji: "🦁" },
        { text: "难过会淡，难题会解，日子会亮。", emoji: "🌈" },
        { text: "愿你有梦可追，有家可归。", emoji: "🏠" },
        { text: "今天阳光免费，喜乐也免费。", emoji: "☀️" },
        { text: "不赶时间的时候，看看路边的花。", emoji: "🌷" },
        { text: "你心里的那团火，别让它熄灭。", emoji: "🔥" },
        { text: "愿福运常伴你左右。", emoji: "🧧" },
        { text: "哭过笑过，都是成长的礼物。", emoji: "🎀" },
        { text: "给自己一个肯定：你已经做得很好。", emoji: "👍" },
        { text: "愿微风带走疲惫，星光点亮希望。", emoji: "⭐" },
        { text: "不喜欢的过去，就留在昨天吧。", emoji: "📅" },
        { text: "你能点开这条，就值得被祝福。", emoji: "💌" },
        { text: "愿工作顺心，生活顺心，万事顺心。", emoji: "🎯" },
        { text: "允许一切发生，然后慢慢好起来。", emoji: "🌊" },
        { text: "你配得上一切好的安排。", emoji: "👑" },
        { text: "把心事写下来，就给心腾出了地方。", emoji: "📝" },
        { text: "愿你三餐烟火暖，四季衣裳安。", emoji: "🍚" },
        { text: "慢慢来，比较快；稳稳走，比较远。", emoji: "🐢" },
        { text: "你的善良，自有它的回响。", emoji: "🔔" },
        { text: "愿烦恼像气球一样飞走～", emoji: "🎈" },
        { text: "今天也要好好吃饭，身体最重要。", emoji: "🥢" },
        { text: "愿你眼里有光，心中有爱。", emoji: "✨" },
        { text: "想到你，就觉得世界温柔了一点。", emoji: "🌍" },
        { text: "不要怕走得慢，只怕停下来。", emoji: "🚶" },
        { text: "愿你我都能在琐碎里捡到糖。", emoji: "🍬" },
        { text: "你的努力不是笑话，是伏笔。", emoji: "📖" },
        { text: "总有一天，你会感谢没放弃的自己。", emoji: "🙌" },
        { text: "愿好运像信号一样满格～", emoji: "📶" },
        { text: "给自己一个微笑，开启温柔模式。", emoji: "😊" },
        { text: "愿你有盔甲也有软肋，有人懂也有人宠。", emoji: "🛡️" },
        { text: "今天是新的一页，随便画点什么都很棒。", emoji: "🖌️" },
        { text: "愿你睡个好觉，醒来又是好天气。", emoji: "😴" },
        { text: "把焦虑换成具体的一小步行动。", emoji: "👟" },
        { text: "你正在成为你想成为的人。", emoji: "🌱" },
        { text: "最后一句话还是想说：天天开心！", emoji: "🌸" }
      ];

      var bgColors = [
        "#FFB6C1", "#87CEEB", "#FFFACD", "#DDA0DD", "#FFE4E1",
        "#98FB98", "#FFA07A", "#AFEEEE", "#F0E68C", "#E6E6FA",
        "#FFDAB9", "#B0E0E6", "#FFDEAD", "#D8BFD8", "#7FFFD4",
        "#FFB347", "#77DD77", "#F49AC2", "#AEC6CF", "#FDFD96"
      ];

      var titles = ["愿你的一天", "小纸条", "今日份", "悄悄话", "叮嘱一下"];

      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function spawnWindows() {
        var stage = document.getElementById("stage");
        var order = shuffle(lines);
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var winW = Math.min(148, vw * 0.42);
        var winH = 26 + 72;

        order.forEach(function (item, i) {
          setTimeout(function () {
            var el = document.createElement("div");
            el.className = "mini-win";
            el.style.animationDelay = "0s";
            el.style.zIndex = String(100 + i);

            var maxX = Math.max(4, vw - winW - 4);
            var maxY = Math.max(4, vh - winH - 56);
            el.style.left = rand(4, maxX) + "px";
            el.style.top = rand(4, maxY) + "px";

            var bg = bgColors[i % bgColors.length];
            if (Math.random() > 0.5) {
              bg = bgColors[Math.floor(Math.random() * bgColors.length)];
            }

            var title = titles[Math.floor(Math.random() * titles.length)];

            el.innerHTML =
              '<div class="mini-win-title">' +
              '<span class="title-text">' + title + "</span>" +
              '<span class="mini-win-btns">' +
              '<i>─</i><i>□</i><i class="close" title="关闭">×</i>' +
              "</span></div>" +
              '<div class="mini-win-body" style="background-color:' + bg + '">' +
              item.emoji +
              "<br/>" +
              escapeHtml(item.text) +
              "</div>";

            el.querySelector(".close").addEventListener("click", function (e) {
              e.stopPropagation();
              el.remove();
            });

            stage.appendChild(el);
          }, i * 35);
        });
      }

      function escapeHtml(s) {
        var d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      document.getElementById("btnClear").addEventListener("click", function () {
        document.getElementById("stage").innerHTML = "";
      });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", spawnWindows);
      } else {
        spawnWindows();
      }
    })();
  </script>
</body>
</html>
